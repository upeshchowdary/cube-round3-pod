# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo. See docs/deploy-render.md.
services:
  - type: web
    name: upesh-cube-pod05
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LOG_LEVEL
        value: WARNING
      # Optional. Set in the Render dashboard, never in this file. Without them every agent runs in replay/rules mode.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional: login with real accounts. Public values (they ship in the page), passed to the UI build by the
      # Dockerfile. Without them the login page offers only the demo profiles.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
